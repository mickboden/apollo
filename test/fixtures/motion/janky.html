<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font:15px system-ui;background:#F4F4F5;color:#1A1C21} #go{position:absolute;left:20px;top:20px;width:120px;height:44px} .box{position:absolute;left:20px;top:100px;width:200px;height:120px;background:#2F5BEA} .box{opacity:.2;transition:opacity 1000ms linear} .on .box{opacity:1}</style></head>
<body><button id="go" onclick="document.body.classList.add('on');let n=0;const t=setInterval(()=>{const s=performance.now();while(performance.now()-s<70){}if(++n>8)clearInterval(t)},80)">Go</button><div class="box"></div></body></html>
