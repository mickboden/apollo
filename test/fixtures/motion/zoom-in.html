<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font:15px system-ui;background:#F4F4F5;color:#1A1C21} #go{position:absolute;left:20px;top:20px;width:120px;height:44px} .card{position:absolute;left:20px;top:100px;width:240px;height:140px;background:#2F5BEA;transform:scale(0.6);transition:transform 200ms cubic-bezier(.22,1,.36,1)} .on .card{transform:scale(1)}</style></head>
<body><button id="go" onclick="document.body.classList.add('on')">Go</button><div class="card"></div></body></html>
