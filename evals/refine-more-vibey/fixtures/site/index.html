<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team overview</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #F4F4F5; color: #1A1C21; }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 24px; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; border: 1px solid #E4E4E7; }
  .card h2 { font-size: 15px; margin: 0 0 6px; }
  .card p { margin: 0; color: rgba(26,28,33,.6); font-size: 14px; }
  .icon { width: 32px; height: 32px; border-radius: 8px; background: #E4E4E7; margin-bottom: 12px; }
</style></head>
<body><main>
  <h1>Team overview</h1>
  <div class="grid">
    <div class="card"><div class="icon"></div><h2>Meetings</h2><p>3 meetings today</p></div>
    <div class="card"><div class="icon"></div><h2>New joiners</h2><p>2 people start Monday</p></div>
    <div class="card"><div class="icon"></div><h2>Reviews</h2><p>4 documents waiting</p></div>
    <div class="card"><div class="icon"></div><h2>Events</h2><p>Summer party on 12 July</p></div>
    <div class="card"><div class="icon"></div><h2>Time off</h2><p>5 people out this week</p></div>
    <div class="card"><div class="icon"></div><h2>Birthdays</h2><p>1 birthday tomorrow</p></div>
    <div class="card"><div class="icon"></div><h2>Goals</h2><p>Q3 goals 62% done</p></div>
    <div class="card"><div class="icon"></div><h2>Tools</h2><p>12 apps connected</p></div>
    <div class="card"><div class="icon"></div><h2>News</h2><p>2 posts this week</p></div>
  </div>
</main></body></html>
