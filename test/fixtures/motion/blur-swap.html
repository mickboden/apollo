<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font:15px system-ui;background:#F4F4F5;color:#1A1C21} #go{position:absolute;left:20px;top:20px;width:120px;height:44px} .box{position:absolute;left:20px;top:100px;width:200px;height:120px;background:#2F5BEA} @keyframes swap{from{filter:blur(8px);opacity:0}to{filter:blur(0);opacity:1}} .on .box{animation:swap 300ms ease-out}</style></head>
<body><button id="go" onclick="document.body.classList.add('on')">Go</button><div class="box"></div></body></html>
